# ============================
# Nextcloud 28 — nginx (Ubuntu 24.04)
# Domain: docs.test-collab-site.com
# Webroot: /var/www/nextcloud
# PHP-FPM: unix:/run/php/php8.3-fpm.sock
# Certs:   /etc/letsencrypt/live/docs.test-collab-site.com/
# ============================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name docs.test-collab-site.com;

    # Allow Let's Encrypt challenge without redirect loops
    location ^~ /.well-known/acme-challenge/ { root /var/www/nextcloud; default_type "text/plain"; }

    # Everything else goes to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.test-collab-site.com;

    # --- SSL ---
    ssl_certificate     /etc/letsencrypt/live/docs.test-collab-site.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.test-collab-site.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root   /var/www/nextcloud;
    index  index.php index.html /index.php$request_uri;

    # Uploads & timeouts tuned for webdav/large files
    client_max_body_size 512M;
    client_body_timeout  300s;
    send_timeout         300s;
    keepalive_timeout    75s;

    # ------------ Security Headers ------------
    # Note: Nextcloud sets CSP itself; do NOT override Content-Security-Policy here.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # ------------ Well-known redirects ------------
    # CalDAV/CardDAV
    location = /.well-known/carddav { return 301 /remote.php/dav; }
    location = /.well-known/caldav  { return 301 /remote.php/dav; }

    # Other Nextcloud well-known endpoints
    location = /.well-known/webfinger { return 301 /index.php/.well-known/webfinger; }
    location = /.well-known/nodeinfo  { return 301 /index.php/.well-known/nodeinfo; }
    location = /.well-known/host-meta { return 301 /public.php?service=host-meta;  }
    location = /.well-known/host-meta.json { return 301 /public.php?service=host-meta-json; }

    # Let's Encrypt challenge (kept under HTTPS too, harmless)
    location ^~ /.well-known/acme-challenge/ { root /var/www/nextcloud; default_type "text/plain"; }

    # -------------------------------------------
    # Core routing: serve static if it exists; otherwise go to front controller
    # This is the key to fix 403s under /apps/* — we never "index" those dirs,
    # we route them through /index.php instead.
    # -------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # Be explicit for /apps/ to avoid directory index checks entirely
    location ^~ /apps/ {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # Public shares and other entry points still go through front controller
    location = /robots.txt  { allow all; log_not_found off; access_log off; }
    location = /favicon.ico { log_not_found off; access_log off; }
    location ^~ /remote.php { try_files $uri $uri/ /index.php$request_uri; }
    location ^~ /public.php { try_files $uri $uri/ /index.php$request_uri; }
    location ^~ /ocs/       { try_files $uri $uri/ /index.php$request_uri; }

    # ---------------- Static Assets Caching ----------------
    # Long cache for immutable assets; Nextcloud uses cache-busting file names
    location ~* \.(?:css|js|mjs|woff2?|svg|gif|ico|png|jpg|jpeg|webp|avif|map)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # ---------------- Deny Access to Sensitive Paths ----------------
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:/|$)  { deny all; }
    location ~ ^/(?:\.(?:htaccess|git|svn|project|idea)|CODEOWNERS)          { deny all; }
    location ~ ^/(?:autotest|occ|issue|indie|db_|console)                    { deny all; }

    # ---------------- PHP handling ----------------
    # Only route specific PHP entry points directly; everything else uses front controller
    location ~ \.php(?:$|/) {
        # Block direct access to arbitrary PHP files under app paths, etc.
        # Only allow known entry points (index.php, remote.php, public.php, ocs/v1.php, ocs/v2.php, cron.php, status.php)
        set $nc_allowed 0;
        if ($uri ~ "^/index\.php")           { set $nc_allowed 1; }
        if ($uri ~ "^/remote\.php")          { set $nc_allowed 1; }
        if ($uri ~ "^/public\.php")          { set $nc_allowed 1; }
        if ($uri ~ "^/ocs/v[12]\.php")       { set $nc_allowed 1; }
        if ($uri ~ "^/cron\.php")            { set $nc_allowed 1; }
        if ($uri ~ "^/status\.php")          { set $nc_allowed 1; }

        if ($nc_allowed = 0) { return 403; }

        # Ensure the file exists (when directly calling a PHP entry file)
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param modHeadersAvailable true;         # for security headers
        fastcgi_param front_controller_active true;     # Nextcloud front controller
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;

        # Reasonable timeouts for WebDAV/large ops
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffers 64 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------------- WebDAV upload optimizations ----------------
    location ^~ /remote.php/dav {
        client_body_buffer_size  512k;
        proxy_request_buffering  off;
    }

    # ---------------- Logging ----------------
    access_log /var/log/nginx/nextcloud_access.log;
    error_log  /var/log/nginx/nextcloud_error.log warn;
}
