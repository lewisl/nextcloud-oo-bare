# ============================
# Nextcloud 28 — nginx (Ubuntu 24.04)
# Domain: docs.test-collab-site.com
# Webroot: /var/www/nextcloud
# PHP-FPM: unix:/run/php/php8.3-fpm.sock
# Certs:   /etc/letsencrypt/live/docs.test-collab-site.com/
# ============================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name docs.test-collab-site.com;

    # Allow Let's Encrypt challenge without redirect loops
    location ^~ /.well-known/acme-challenge/ { root /var/www/nextcloud; default_type "text/plain"; }

    # Everything else goes to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.test-collab-site.com;

    # --- SSL ---
    ssl_certificate     /etc/letsencrypt/live/docs.test-collab-site.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.test-collab-site.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root   /var/www/nextcloud;
    index  index.php index.html;

    # Uploads & timeouts tuned for webdav/large files
    client_max_body_size 512M;
    client_body_timeout  300s;
    send_timeout         300s;
    keepalive_timeout    75s;

    # ------------ Security Headers ------------
    # Note: Nextcloud sets CSP itself; do NOT override Content-Security-Policy here.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # ------------ Well-known redirects ------------
    # CalDAV/CardDAV
    location = /.well-known/carddav { return 301 /remote.php/dav; }
    location = /.well-known/caldav  { return 301 /remote.php/dav; }

    # Other Nextcloud well-known endpoints
    location = /.well-known/webfinger { return 301 /index.php/.well-known/webfinger; }
    location = /.well-known/nodeinfo  { return 301 /index.php/.well-known/nodeinfo; }
    location = /.well-known/host-meta { return 301 /public.php?service=host-meta;  }
    location = /.well-known/host-meta.json { return 301 /public.php?service=host-meta-json; }

    # Let's Encrypt challenge (kept under HTTPS too, harmless)
    location ^~ /.well-known/acme-challenge/ { root /var/www/nextcloud; default_type "text/plain"; }

    # --- ONLYOFFICE editor under /onlyoffice/ (one-domain deployment) ---
    location ^~ /onlyoffice/ {
        proxy_pass         http://127.0.0.1:8080/;  # Document Server local listener
        proxy_http_version 1.1;

        # Tell Document Server which host/prefix it should advertise
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_set_header   X-Forwarded-Host   $host/onlyoffice;
        proxy_set_header   X-Forwarded-Port   443;
        proxy_set_header   X-Forwarded-Prefix "";
        proxy_set_header   Authorization      $http_authorization;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         $connection_upgrade;

        client_max_body_size 200m;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
        proxy_redirect        off;
    }

    # -------------------------------------------
    # Core routing: serve static if it exists; otherwise go to front controller
    # This is the key to fix 403s under /apps/* — we never "index" those dirs,
    # we route them through /index.php instead.
    # -------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # Handle Nextcloud's front controller and any /index.php/... paths via PHP
    # HIGH PRIORITY: This ^~ prefix beats all regex blocks, preventing redirect loops
    location ^~ /index.php {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
    }

    # ---------------- WebDAV/Remote PHP handling ----------------
    # Handle remote.php specifically (WebDAV, CalDAV, CardDAV)
    location ^~ /remote.php {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
    }

    # Static assets (hashed bundles, modules, wasm)
    location ~ ^/(?!index\.php/).*\.(?:css|js|mjs|wasm|woff2?|svg|gif|map)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        add_header Cache-Control "public, max-age=15552000, immutable";
        access_log off;
    }

    # Images and other assets – exclude /index.php/ here too
    location ~ ^/(?!index\.php/).*\.(?:png|html|ttf|ico|jpg|jpeg|webp|avif)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        add_header Cache-Control "public, max-age=15552000, immutable";
        access_log off;
    }

    # Handle /apps/ directory paths - force through front controller
    # BUT exclude /api/ paths and any direct asset/file requests containing extensions
    location ~ ^/apps/(?!.*/api/)(?!.*\.[^/]+$).*/?$ {
        rewrite ^(.*)$ /index.php$1 last;
    }

    # Public shares and other entry points still go through front controller
    location = /robots.txt  { allow all; log_not_found off; access_log off; }
    location = /favicon.ico { log_not_found off; access_log off; }
    # REMOVED overrides - let PHP scripts be handled by their actual files
    location ^~ /public.php { try_files $uri $uri/ /index.php$request_uri; }

    # ---------------- Deny Access to Sensitive Paths ----------------
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }

    # ---------------- Generic PHP handling ----------------
    # For other PHP entry points (public.php, etc.)
    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
    }

    # Safety: don't execute stray *.php directly
    location ~ \.php$ {
        return 404;
    }

    # WebDAV upload optimizations moved to remote.php handler above

    # ---------------- Logging ----------------
    access_log /var/log/nginx/nextcloud_access.log;
    error_log  /var/log/nginx/nextcloud_error.log warn;
}
